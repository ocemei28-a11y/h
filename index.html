<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Overlay Effect</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #0f1115;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }

    /* Container for stacked images */
    .holo-container {
      position: relative;
      width: 280px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      cursor: pointer;
    }

    /* Bottom Layer: The Photo */
    .photo-layer {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Top Layer: Hologram Image with Metallic Blend */
    .holo-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      
      /* Base state head-on: visible natural tone (#DAE1E6 tint) */
      opacity: 0.25;
      filter: brightness(1) contrast(1);
      mix-blend-mode: color-dodge; 
      transition: opacity 0.1s ease-out, filter 0.1s ease-out;
    }

    button {
      margin-top: 25px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #DAE1E6;
      color: #111;
      cursor: pointer;
    }

    #debug-log {
      margin-top: 12px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="holo-container" id="holoContainer">
    <!-- Base photo -->
    <img src="overlay-image.png" alt="Photo" class="photo-layer">
    <!-- Dynamic Hologram layer -->
    <img src="holoimg.png" alt="Hologram" class="holo-layer" id="holoImg">
  </div>

  <button id="sensorBtn">Activate Mobile Motion Sensors</button>
  <div id="debug-log">Hover mouse over photo (Desktop) or tap button (Mobile)</div>

  <script>
    const holoImg = document.getElementById('holoImg');
    const container = document.getElementById('holoContainer');
    const debugLog = document.getElementById('debug-log');
    const sensorBtn = document.getElementById('sensorBtn');

    // Adjusts opacity and brightness based on tilt intensity
    function updateHoloEffect(intensity) {
      // Head-on (intensity = 0): low opacity (0.25)
      // Steep angle (intensity = 1): high opacity (0.95) & blown-out specular highlights
      const opacity = 0.25 + (intensity * 0.7);
      const brightness = 1 + (intensity * 0.8);

      holoImg.style.opacity = opacity.toFixed(2);
      holoImg.style.filter = `brightness(${brightness.toFixed(2)}) contrast(1.2)`;
    }

    // 1. Mobile Gyroscope Handler
    function handleOrientation(event) {
      const beta = event.beta || 0;   // Tilt forward/back (-180 to 180)
      const gamma = event.gamma || 0; // Tilt left/right (-90 to 90)

      // Calculate offset distance from flat holding position (~45deg pitch)
      const betaDiff = Math.abs(beta - 45);
      const gammaDiff = Math.abs(gamma);
      const totalTilt = Math.sqrt(betaDiff * betaDiff + gammaDiff * gammaDiff);

      // Map tilt range to 0.0 - 1.0 intensity
      const intensity = Math.min(totalTilt / 40, 1);

      updateHoloEffect(intensity);
      debugLog.innerHTML = `Tilt Offset: ${Math.round(totalTilt)}° | Hologram Brightness: ${Math.round(intensity * 100)}%`;
    }

    // 2. Desktop Mouse Movement Fallback
    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left - (rect.width / 2);
      const y = e.clientY - rect.top - (rect.height / 2);

      const distance = Math.sqrt(x * x + y * y);
      const intensity = Math.min(distance / (rect.width / 2), 1);

      updateHoloEffect(intensity);
    });

    container.addEventListener('mouseleave', () => {
      updateHoloEffect(0); // Reset to base state
    });

    // 3. Motion Sensor Permissions for iOS & Android
    sensorBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              sensorBtn.style.display = 'none';
            } else {
              debugLog.innerText = 'Sensor access denied.';
            }
          })
          .catch(err => debugLog.innerText = 'Error: ' + err.message);
      } else if ('DeviceOrientationEvent' in window) {
        window.addEventListener('deviceorientation', handleOrientation);
        sensorBtn.style.display = 'none';
      } else {
        debugLog.innerText = 'Device Orientation not supported.';
      }
    });
  </script>
</body>
</html>
