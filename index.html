<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Hologram Effect</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f4; /* Contrast background */
      margin: 0;
    }

    /* Container sized strictly to the logo */
    .holo-logo-wrapper {
      position: relative;
      display: inline-block;
    }

    /* Base Image - Head-on color #DAE1E6 base */
    .holo-logo-wrapper img.base-logo {
      display: block;
      max-width: 250px;
      height: auto;
    }

    /* White Glare Layer masked strictly to the PNG shape */
    .holo-glare-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      pointer-events: none;
      opacity: 0; /* Fully transparent head-on */
      transition: opacity 0.1s ease-out;

      /* Mask the white color overlay so it ONLY covers the visible pixels of holoimg.png */
      -webkit-mask-image: url('holoimg.png');
      mask-image: url('holoimg.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }
  </style>
</head>
<body>

  <div class="holo-logo-wrapper" id="logoWrapper">
    <!-- Original image -->
    <img src="holoimg.png" alt="Holographic Logo" class="base-logo">
    <!-- Masked layer that turns the logo pure white on tilt -->
    <div class="holo-glare-layer" id="holoGlare"></div>
  </div>

  <script>
    const glareLayer = document.getElementById('holoGlare');

    function handleOrientation(event) {
      const beta = Math.abs(event.beta || 0);
      const gamma = Math.abs(event.gamma || 0);

      // Measure total angle shift from flat resting position (~45deg holding angle)
      const betaOffset = Math.abs(beta - 45); 
      const totalTilt = Math.sqrt(betaOffset * betaOffset + gamma * gamma);

      // Head-on = 0 opacity (shows original image)
      // Steep angle = higher opacity (turns logo white)
      let opacity = totalTilt / 40;
      if (opacity > 0.9) opacity = 0.9; // Max white intensity
      if (opacity < 0) opacity = 0;

      glareLayer.style.opacity = opacity;
    }

    // Permission handler for mobile devices
    function requestDeviceOrientation() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    window.addEventListener('click', requestDeviceOrientation, { once: true });
    window.addEventListener('touchstart', requestDeviceOrientation, { once: true });
  </script>
</body>
</html>
