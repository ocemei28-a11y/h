<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hologram Tilt Test</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
    }

    /* Container for logo and overlay */
    .holo-wrapper {
      position: relative;
      width: 250px;
      margin-bottom: 20px;
    }

    /* Base logo image */
    .holo-wrapper img.base-logo {
      display: block;
      width: 100%;
      height: auto;
    }

    /* White overlay masked to logo bounds */
    .holo-glare-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.05s linear;

      -webkit-mask-image: url('holoimg.png');
      mask-image: url('holoimg.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background-color: #DAE1E6;
      color: #111;
      cursor: pointer;
    }

    #debug-log {
      margin-top: 15px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="holo-wrapper">
    <img src="holoimg.png" alt="Logo" class="base-logo">
    <div class="holo-glare-layer" id="holoGlare"></div>
  </div>

  <button id="enableSensorsBtn">Enable Hologram Effect</button>
  <div id="debug-log">Status: Tap button to activate motion sensors.</div>

  <script>
    const glareLayer = document.getElementById('holoGlare');
    const debugLog = document.getElementById('debug-log');
    const enableBtn = document.getElementById('enableSensorsBtn');

    function handleOrientation(event) {
      const beta = event.beta || 0;   // Front-to-back tilt (-180 to 180)
      const gamma = event.gamma || 0; // Left-to-right tilt (-90 to 90)

      // Measure deviation from normal holding position (~45deg pitch, 0deg roll)
      const betaDiff = Math.abs(beta - 45);
      const gammaDiff = Math.abs(gamma);

      // Calculate total tilt distance
      const totalTilt = Math.sqrt(betaDiff * betaDiff + gammaDiff * gammaDiff);

      // Normalize tilt to opacity range: 0 (head-on) to 0.95 (steep angle)
      let opacity = totalTilt / 40;
      if (opacity > 0.95) opacity = 0.95;
      if (opacity < 0) opacity = 0;

      glareLayer.style.opacity = opacity;

      // Real-time sensor readout
      debugLog.innerHTML = `Beta: ${Math.round(beta)}° | Gamma: ${Math.round(gamma)}°<br>Opacity: ${opacity.toFixed(2)}`;
    }

    function startSensors() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ motion permission flow
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              enableBtn.style.display = 'none';
              debugLog.innerText = 'Sensors active. Tilt device to test.';
            } else {
              debugLog.innerText = 'Permission denied for motion sensors.';
            }
          })
          .catch(err => {
            debugLog.innerText = 'Error: ' + err.message;
          });
      } else if ('DeviceOrientationEvent' in window) {
        // Android / Non-iOS flow
        window.addEventListener('deviceorientation', handleOrientation);
        enableBtn.style.display = 'none';
        debugLog.innerText = 'Sensors active. Tilt device to test.';
      } else {
        debugLog.innerText = 'DeviceOrientation is not supported on this browser/device.';
      }
    }

    enableBtn.addEventListener('click', startSensors);
  </script>
</body>
</html>
